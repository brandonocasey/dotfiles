# agt global settings. Reference: agt docs/reference.md, "$XDG_CONFIG_HOME/agt/config.toml".

# The defaults plus the chezmoi source, so `agt cleanup` also sweeps the task scratch agents
# leave there.
[worktree]
roots = ["~/Projects/*/*", "~/projects/*/*", "~/.local/share/chezmoi"]

[worktree.hooks]
# `agt worktree remove --yes` and `agt cleanup` run these in the worktree before removing it, and a
# failing one stops the removal. Delete the worktree's own simulator and stop its emulator, which
# live outside the checkout. Hosts without Xcode or adb skip them.
remove = [
  '[ "$(uname -s)" = Darwin ] && command -v xcrun >/dev/null 2>&1 || exit 0; sh "$HOME/.config/agents/skills/host-preflight/scripts/ios-sim" rm "$AGT_WORKTREE"',
  'command -v adb >/dev/null 2>&1 || exit 0; sh "$HOME/.config/agents/skills/host-preflight/scripts/android-emu" rm "$AGT_WORKTREE"',
]

# Without this, `agt review publish` keeps approvals and comments local and posts nothing.
[pull_requests]
push = "manual"

# Publish rom-weaver reviews to GitHub after `agt review run end`.
[[tracker]]
host = "github.com"
repo = "rom-weaver/rom-weaver"
pull_requests = { push = "auto" }
