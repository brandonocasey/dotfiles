[tools]
node = "26"
go = ['latest']
uv = ['latest']
# Language servers for the Claude Code LSP plugins; the TypeScript one is
# TypeScript 7 (run_onchange_after_07-lsp-install) with the ~/.local/bin wrapper.
rust-analyzer = 'latest'
'npm:pyright' = 'latest'

[settings]
experimental = true
# Use the system python instead of a mise-managed one (replaces the deprecated
# `python = ['system']` pseudo-version).
disable_tools = ['python']
trusted_config_paths = [
    '~/Projects/',
    '~/.local/share/vibetree/worktrees/',
    '~/projects'
]
idiomatic_version_file_enable_tools = ["node"]

[_]
file = { path = ".vt.env.local", required = false }
