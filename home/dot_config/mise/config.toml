[tools]
node = "26"
go = ['latest']
uv = ['latest']
# Syntax-aware git merge driver (wired in ~/.config/git/config and attributes)
'forgejo:mergiraf/mergiraf' = 'latest'
# Review store for the review skill; private releases, read with the gh token.
# Pinned: bump it with the review rules that need it (review/references/store.md).
'github:brandonocasey/agt' = { version = '0.10.1', os = ['macos', 'linux'] }

[settings]
experimental = true
# Use the system python instead of a mise-managed one (replaces the deprecated
# `python = ['system']` pseudo-version).
disable_tools = ['python']
trusted_config_paths = [
    '~/Projects/',
    '~/.local/share/vibetree/worktrees/',
    '~/projects'
]
idiomatic_version_file_enable_tools = ["node"]
# Our own releases need no supply-chain wait.
minimum_release_age_excludes = ['github:brandonocasey/agt']

[_]
file = { path = ".vt.env.local", required = false }
