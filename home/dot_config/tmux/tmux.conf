# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Agent hooks on an ssh host without tmux send the window-name escape
# "agent-session:<title>" (see ~/.claude/hooks/agent-tmux-session.sh); rename
# the session to <title> and give the window back its automatic name. The '.'
# in the pattern matches the ':' that the s/// modifier cannot parse. A
# '-t #{...}' target is not format-expanded here, so use the hook's own target.
set-window-option -g allow-rename on
set-hook -g window-renamed {
  if-shell -F '#{m:agent-session:*,#{window_name}}' {
    rename-session '#{s/^agent-session.//:window_name}'
    set-window-option automatic-rename on
  }
}

# each session gets its own color for its name in the status line
set-hook -g session-created 'run-shell -b "sh ~/.config/tmux/scripts/session-color.sh"'
run-shell -b 'sh ~/.config/tmux/scripts/session-color.sh'

set -g status-keys vi
set -g history-limit 100000

setw -g mode-keys vi
setw -g mouse on

# set base index to 1 as 0 is too far
set -g base-index 1
setw -g pane-base-index 1

# forward modified keys (Shift+Enter, Ctrl+Enter) to apps; requires tmux 3.5+
set -g extended-keys on
set -g extended-keys-format csi-u

set -sg escape-time 10
bind-key C-a send-prefix
set-option -g focus-events on
set-option -ga terminal-features "xterm-256color:RGB:hyperlinks"
# tmux 3.7c does not auto-detect Ghostty, so OSC 8 links are stripped without this
set-option -ga terminal-features "xterm-ghostty:RGB:hyperlinks"

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# sets tmux to use OSC 52 escape
set -g set-clipboard on
set -g allow-passthrough on

# Forces tmux to use the "c;" option
# set -ag terminal-overrides "vte*:XT:Ms=\\E]52;c;%p2%s\\7,xterm*:XT:Ms=\\E]52;c;%p2%s\\7"

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# create a new session. sesh-pick.sh binds the same key, so keep them in sync.
bind-key C new-session
# :kill-and-next — kill the current window and move to the next one; if it is
# the session's only window, kill the session and switch to the next session
set -s command-alias[100] kill-and-next='if-shell -F "#{>:#{session_windows},1}" { next-window ; kill-window -t ! } { if-shell -F "#{>:#{server_sessions},1}" { run-shell "tmux switch-client -c \"#{client_name}\" -n; tmux kill-session -t \"#{session_name}\"" } { display-message "No other windows or sessions." } }'
bind-key K kill-and-next
bind-key k kill-and-next

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

# sesh: smart session picker (prefix + s or T); the built-in session tree
# moves to prefix + S
bind-key s run-shell "sh ~/.config/tmux/scripts/sesh-pick.sh"
bind-key T run-shell "sh ~/.config/tmux/scripts/sesh-pick.sh"
bind-key S choose-tree -Zs -F "#{E:@tree_format}"
bind-key w choose-tree -Zw -F "#{E:@tree_format}"

# 1 while the pane runs Claude Code, whose process is named after its version
# on macOS and "claude" on Linux.
# tmux drops a backslash before ".", so "[.]" matches a literal dot.
set -g @is_claude "#{m/r:^([0-9]+[.][0-9]+[.][0-9]+|claude)$,#{pane_current_command}}"
# The agent a pane runs: the @agent_kind its hooks set (~/.claude/hooks/tmux-bell.sh),
# else from the process.
set -g @agent_tool "#{?#{@agent_kind},#{@agent_kind},#{?#{E:@is_claude},claude,#{?#{==:#{pane_current_command},codex},codex,}}}"
# The agents a session runs, each listed once; sesh-list.sh does the same
set -g @session_tools "#{?#{m:*claude*,#{W:#{P:#{E:@agent_tool}}}}, · claude,}#{?#{m:*codex*,#{W:#{P:#{E:@agent_tool}}}}, · codex,}"
# choose-tree's default format, with agent names on session and pane rows
set -g @tree_format "#{?pane_format,#{?pane_marked,#[reverse],}#{?#{E:@agent_tool},#{E:@agent_tool},#{pane_current_command}}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: \"#{pane_title}\",},#{?window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: \"#{pane_title}\",},#{session_windows} windows#{E:@session_tools}#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}"

set-option -g default-shell $SHELL
# List of plugins (tpm itself is pinned in .chezmoiexternal.toml, not listed here)
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
# status line styled after the Tide lean prompt: no background, colored text, gray separators
# reset status-format left behind on a running server by the removed tmux-powerline
set -gu status-format
set -g status-style "bg=default,fg=#949494"
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 100
# project#branch of the active pane, like the Claude Code status line, then the
# session name: its @session_color (green until set), yellow while the prefix is pressed
set -g status-left " #(sh ~/.config/tmux/scripts/project.sh '#{pane_current_path}')#[fg=#6C6C6C] │#{?client_prefix,#[fg=#D7AF00],#[fg=#{?#{@session_color},#{@session_color},#5FD700}]}#[bold] #S#[nobold] #[default]#[fg=#6C6C6C]│ "
# Claude Code panes (the process is named after its version) show the session
# title Claude puts in the pane title, minus its leading spinner icon
set -g automatic-rename-format "#{?#{E:@is_claude},#{=/32/…:#{s/^[^ ]* //:pane_title}},#{?pane_in_mode,[tmux],#{pane_current_command}}}#{?pane_dead,[dead],}"
# The window list shows only the agent's state; the session name already says
# what it is. Claude and Codex hooks set the pane option @agent_state through
# ~/.claude/hooks/tmux-bell.sh: red needs input, yellow waits for a prompt while
# background work runs, green works. Claude panes without it (the process is
# named after its version) fall back to the pane title: the idle icon ✳ means
# input, a spinner means working. Other windows show nothing.
set -g @agent_status "#{?#{==:#{@agent_state},input},#[fg=#D70000]●,#{?#{==:#{@agent_state},background},#[fg=#D7AF00]●,#{?#{==:#{@agent_state},working},#[fg=#5FD700]●,#{?#{E:@is_claude},#{?#{||:#{window_bell_flag},#{m:✳*,#{pane_title}}},#[fg=#D70000]●,#[fg=#5FD700]●},}}}}"
set -g window-status-bell-style default
set -g window-status-format "#{E:@agent_status}"
set -g window-status-current-format "#{E:@agent_status}"
set -g window-status-separator "  "
# The active pane's dev-server address ("IP:port"), which the Claude Code
# status line sets in @agent_addr, always shows when set.
set -g status-right "#{?#{!=:#{W:#{E:@agent_status}},},#[fg=#6C6C6C] │ ,}#{?#{@agent_addr},#{@agent_addr}#[default]#[fg=#6C6C6C] │ ,}#[fg=#8787AF]#(sh ~/.config/tmux/scripts/sysload.sh) "
set -g message-style "bg=default,fg=#00AFFF"
set -g message-command-style "bg=default,fg=#00AFFF"
set -g pane-border-style "fg=#6C6C6C"
set -g pane-active-border-style "fg=#00AFFF"
# dim inactive panes (kept from the former onedark theme)
set -g window-style "fg=#5c6370"
set -g window-active-style "fg=#aab2bf"

set -g @yank_selection_mouse 'clipboard'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# :reload-config — tmux-which-key's alias sources ~/.tmux.conf, which does not
# exist here; point it at this file (set after tpm so it wins)
set -s command-alias[202] reload-config='source-file ~/.config/tmux/tmux.conf ; display-message "tmux.conf reloaded!"'
