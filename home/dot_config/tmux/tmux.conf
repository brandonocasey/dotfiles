# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# Agent hooks on an ssh host without tmux send the window-name escape
# "agent-session:<title>" (see ~/.claude/hooks/agent-tmux-session.sh); rename
# the session to <title> and give the window back its automatic name. The '.'
# in the pattern matches the ':' that the s/// modifier cannot parse. A
# '-t #{...}' target is not format-expanded here, so use the hook's own target.
set-window-option -g allow-rename on
set-hook -g window-renamed {
  if-shell -F '#{m:agent-session:*,#{window_name}}' {
    rename-session '#{s/^agent-session.//:window_name}'
    set-window-option automatic-rename on
  }
}

set -g status-keys vi
set -g history-limit 100000

setw -g mode-keys vi
setw -g mouse on

# set base index to 1 as 0 is too far
set -g base-index 1
setw -g pane-base-index 1

# forward modified keys (Shift+Enter, Ctrl+Enter) to apps; requires tmux 3.5+
set -g extended-keys on
set -g extended-keys-format csi-u

set -sg escape-time 10
bind-key C-a send-prefix
set-option -g focus-events on
set-option -ga terminal-features "xterm-256color:RGB:hyperlinks"
# tmux 3.7c does not auto-detect Ghostty, so OSC 8 links are stripped without this
set-option -ga terminal-features "xterm-ghostty:RGB:hyperlinks"

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# sets tmux to use OSC 52 escape
set -g set-clipboard on
set -g allow-passthrough on

# Forces tmux to use the "c;" option
# set -ag terminal-overrides "vte*:XT:Ms=\\E]52;c;%p2%s\\7,xterm*:XT:Ms=\\E]52;c;%p2%s\\7"

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# create a new session
bind-key C new-session
# :kill-and-next — kill the current window and move to the next one; if it is
# the session's only window, kill the session and switch to the next session
set -s command-alias[100] kill-and-next='if-shell -F "#{>:#{session_windows},1}" { next-window ; kill-window -t ! } { if-shell -F "#{>:#{server_sessions},1}" { run-shell "tmux switch-client -c \"#{client_name}\" -n; tmux kill-session -t \"#{session_name}\"" } { display-message "No other windows or sessions." } }'
bind-key K kill-and-next

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

# sesh: smart session picker (prefix + T)
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all  ^t tmux  ^g configs  ^x zoxide  ^f find  ^d kill' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
)\""

set-option -g default-shell $SHELL
# List of plugins (tpm itself is pinned in .chezmoiexternal.toml, not listed here)
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin 'noscript/tmux-mighty-scroll'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
# status line styled after the Tide lean prompt: no background, colored text, gray separators
# reset status-format left behind on a running server by the removed tmux-powerline
set -gu status-format
set -g status-style "bg=default,fg=#949494"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100
# session name: green like the Tide prompt character, yellow while the prefix is pressed
# +N counts the other sessions
set -g status-left "#[fg=#5F8787] %H:%M #[fg=#6C6C6C]│#{?client_prefix,#[fg=#D7AF00],#[fg=#5FD700]}#[bold] #S#[nobold]#{?#{>:#{server_sessions},1}, +#{e|-:#{server_sessions},1},} #[default]#[fg=#6C6C6C]│ "
# Claude Code panes (the process is named after its version) show the session
# title Claude puts in the pane title, minus its leading spinner icon
set -g automatic-rename-format "#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{=/32/…:#{s/^[^ ]* //:pane_title}},#{?pane_in_mode,[tmux],#{pane_current_command}}}#{?pane_dead,[dead],}"
# yellow dot: a bell rang in that window; ~/.claude/hooks/tmux-bell.sh rings it when Claude waits
set -g window-status-bell-style default
set -g window-status-format "#{?window_bell_flag,#[fg=#D7AF00]● ,}#[fg=#0087AF]#W#{?window_zoomed_flag, +,}"
set -g window-status-current-format "#[fg=#00AFFF,bold]#W#{?window_zoomed_flag, +,}"
set -g window-status-separator "  "
set -g status-right "#[fg=#5FD700]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null)#[fg=#6C6C6C] │ #[fg=#8787AF]#(sh ~/.config/tmux/scripts/sysload.sh) "
set -g message-style "bg=default,fg=#00AFFF"
set -g message-command-style "bg=default,fg=#00AFFF"
set -g pane-border-style "fg=#6C6C6C"
set -g pane-active-border-style "fg=#00AFFF"
# dim inactive panes (kept from the former onedark theme)
set -g window-style "fg=#5c6370"
set -g window-active-style "fg=#aab2bf"

set -g @yank_selection_mouse 'clipboard'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
