#!/bin/bash
# chezmoi modify_ script. It reads the live ~/.codex/config.toml on stdin and
# prints the file chezmoi should apply. Everything below is enforced from this
# file EXCEPT the keys in KEEP_KEYS and the tables in KEEP_SECTIONS, whose live
# values are copied through verbatim, so changing them in the TUI never shows up
# as chezmoi drift.
# To hand another top-level key to the app, add it to KEEP_KEYS. To hand another
# table to the app, add its name to KEEP_SECTIONS and delete the managed copy of
# that table from the body below.
set -euo pipefail

KEEP_KEYS=(model model_reasoning_effort)
KEEP_SECTIONS=(projects)

body=$(
  cat <<'TOML'
model = "gpt-5.6-luna"
personality = "pragmatic"
model_reasoning_effort = "xhigh"
approvals_reviewer = "user"
plan_mode_reasoning_effort = "high"
service_tier = "default"
notify = ["/Users/bcasey/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]
approval_policy = "never"
sandbox_mode    = "danger-full-access"
allow_login_shell = true

[shell_environment_policy]
inherit = "all"
experimental_use_profile = true

[notice]
hide_gpt5_1_migration_prompt = true
hide_rate_limit_model_nudge = true
fast_default_opt_out = true

[notice.model_migrations]
"gpt-5.1-codex" = "gpt-5.2-codex"
"gpt-5.3-codex" = "gpt-5.5"
"gpt-5.4" = "gpt-5.5"

[tui]
status_line = ["project-name", "five-hour-limit", "weekly-limit", "model-with-reasoning", "git-branch", "pull-request-number", "thread-title"]
theme = "one-half-dark"
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[features]
memories = false
terminal_resize_reflow = true
goals = true
hooks = true
js_repl = false

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[mcp_servers.node_repl]
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120.0

enabled = false


[mcp_servers.node_repl.env]
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.721.41059"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"
CODEX_HOME = "/Users/bcasey/.codex"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = "Control desktop apps on macOS through Computer Use."
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "6d25aa7656feac858f3a3bdaea5bcbab0dbfd426c9de8e6931ce90c399ee8e4f,e13fd947e846d3d306e9249dd3c73d14931b6494803dbafb16cef85e6add9506"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/bcasey/.codex"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest", "--headless", "--isolated"]

[mcp_servers.chrome-headed]
command = "npx"
args = ["chrome-devtools-mcp@latest", "--chromeArg=--mute-audio"]

[mcp_servers.firefox-devtools]
command = "bash"
args = ["-c", "PATH=/Users/bcasey/.local/share/mise/installs/node/22.21.1/bin:$PATH npm_config_prefer_offline=false exec npx -y @mozilla/firefox-devtools-mcp@0.9.5 --headless"]

[mcp_servers.firefox-headed]
command = "bash"
args = ["-c", "PATH=/Users/bcasey/.local/share/mise/installs/node/22.21.1/bin:$PATH npm_config_prefer_offline=false exec npx -y @mozilla/firefox-devtools-mcp@0.9.5"]

[mcp_servers.safari]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--browser", "webkit", "--headless"]

[mcp_servers.safari-headed]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--browser", "webkit"]

[desktop]
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
conversationDetailMode = "STEPS_PROSE"

[marketplaces.openai-bundled]
last_updated = "2026-07-27T15:18:40Z"
source_type = "local"
source = "/Users/bcasey/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
last_updated = "2026-07-27T15:19:11Z"
source_type = "local"
source = "/Users/bcasey/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."sites@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[shell_environment_policy.set]
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
NODE_REPL_TRUSTED_BROWSER_CLIENT_SHA256S = "6d25aa7656feac858f3a3bdaea5bcbab0dbfd426c9de8e6931ce90c399ee8e4f,e13fd947e846d3d306e9249dd3c73d14931b6494803dbafb16cef85e6add9506"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/bcasey/.codex"
@KEEP_SECTIONS@
TOML
)

live=$(cat)

# awk -v strips backslashes from the value, so pass the regex in the environment.
SECTION_RE="^[[:space:]]*\[($(
  IFS='|'
  echo "${KEEP_SECTIONS[*]}"
))([.]|\])"
export SECTION_RE

# Codex writes this file with toml_edit, which patches single keys in place.
# Copying its text verbatim therefore keeps the output byte-identical.
# Live values for the app-owned tables, in the order the app wrote them.
KEEP_SECTIONS_TOML=$(printf '%s\n' "$live" | awk '
  /^[[:space:]]*\[/ { p = ($0 ~ ENVIRON["SECTION_RE"]) }
  p { print }
' | awk '
  { lines[NR] = $0 }
  END {
    last = NR
    while (last > 0 && lines[last] ~ /^[[:space:]]*$/) last--
    for (i = 1; i <= last; i++) print lines[i]
  }
')
export KEEP_SECTIONS_TOML

# Live values for the app-owned top-level keys. They all sit above the first
# table header, so stop reading there.
for key in "${KEEP_KEYS[@]}"; do
  value=$(printf '%s\n' "$live" | awk -v k="$key" '
    /^[[:space:]]*\[/ { exit }
    $0 ~ "^" k "[[:space:]]*=" { print; exit }
  ')
  export "KEEP_KEY_${key}=${value}"
done

printf '%s\n' "$body" | awk -v keys="${KEEP_KEYS[*]}" '
  BEGIN {
    n = split(keys, klist, " ")
  }
  # Print the app-owned tables at the end of the file. Codex appends new tables
  # there, so copying them from that position keeps the output byte-identical.
  # An empty value drops the placeholder, which a machine with no config needs.
  /^@KEEP_SECTIONS@$/ {
    if (ENVIRON["KEEP_SECTIONS_TOML"] != "") {
      print ""
      print ENVIRON["KEEP_SECTIONS_TOML"]
    }
    next
  }
  {
    if (!intable) {
      if ($0 ~ /^[[:space:]]*\[/) {
        intable = 1
      } else {
        for (i = 1; i <= n; i++) {
          live_line = ENVIRON["KEEP_KEY_" klist[i]]
          if (live_line != "" && $0 ~ "^" klist[i] "[[:space:]]*=") {
            print live_line
            next
          }
        }
      }
    }
    print
  }
'
