name: Tests
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: astral-sh/setup-uv@v10.3.3

      # The code-shape tests run uv offline, so put lizard in the uv cache first.
      - name: Cache the code-shape parser
        run: uv run --quiet --script home/private_dot_local/bin/executable_code-shape --help

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish tmux rsync zip zsh
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # code-shape runs qlty for its duplication and boolean checks.
      - name: Install qlty
        run: |
          curl -fsSLo "$RUNNER_TEMP/qlty.tar.xz" https://github.com/qltysh/qlty/releases/download/v0.668.0/qlty-x86_64-unknown-linux-gnu.tar.xz
          echo "59318df9b8d264c9544ae426007867fcbf62417f68bdac28f1e2799b73d6ebfc  $RUNNER_TEMP/qlty.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/qlty"
          tar -xJf "$RUNNER_TEMP/qlty.tar.xz" -C "$RUNNER_TEMP/qlty"
          install -D "$(find "$RUNNER_TEMP/qlty" -type f -name qlty)" "$HOME/.local/bin/qlty"
          qlty --version

      - name: Python tests
        run: |
          ls test/unit | sed -n 's/^\(test_.*\)\.py$/\1/p' |
            xargs -P "$(nproc)" -n 1 sh -c 'python3 -m unittest discover -s test/unit -p "$1.py" -v > "$RUNNER_TEMP/$1.log" 2>&1 && echo "$1: $(tail -n 1 "$RUNNER_TEMP/$1.log")" || { cat "$RUNNER_TEMP/$1.log"; exit 1; }' sh

      - name: Node tests
        run: node --test home/dot_config/exact_agents/exact_skills/*/exact_test/*.test.*js

  # Claude Code runs the hooks with the python3 on PATH, which can be Apple's Python 3.9.
  hooks-python39:
    # setup-python has no Python 3.9 build for Ubuntu 26.04, which ubuntu-latest resolves to.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      # The Ubuntu mirror stalls for tens of seconds at times, so keep the zsh
      # packages in the cache and skip apt-get update when they are there.
      - name: Cache zsh packages
        id: zsh-debs
        uses: actions/cache@v4
        with:
          path: ~/zsh-debs
          key: zsh-debs-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}

      - name: Download zsh packages
        if: steps.zsh-debs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          mkdir -p ~/zsh-debs
          cd ~/zsh-debs
          apt-get download zsh zsh-common

      - name: Install zsh
        run: sudo apt-get install -y --no-install-recommends ~/zsh-debs/*.deb

      - name: Hook tests on Python 3.9
        working-directory: test/unit
        run: python -m unittest -v test_bash_guard test_continue_guard test_edit_guard test_rule_gate
